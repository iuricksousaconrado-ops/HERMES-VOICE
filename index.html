<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HERMES VOICE</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #111;
      color: white;
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    #resultado {
      margin-top: 30px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <h1>HERMES</h1>

  <p>Assistente de voz</p>

  <button onclick="ouvir()">🎙️ Falar</button>

  <div id="resultado">
    Toque no botão e fale.
  </div>

  <script>

   <script>

const URL_HERMES = "COLE_AQUI_A_URL_DO_APPS_SCRIPT";

var reconhecimento = new (
  window.SpeechRecognition ||
  window.webkitSpeechRecognition
)();

reconhecimento.lang = "pt-BR";
reconhecimento.continuous = false;
reconhecimento.interimResults = false;

function falar() {

  document.getElementById("resultado").innerText =
    "🎙️ Estou ouvindo...";

  reconhecimento.start();
}

reconhecimento.onresult = function(event) {

  var texto = event.results[0][0].transcript;

  document.getElementById("resultado").innerText =
    "Você disse: " + texto;

  var url =
    URL_HERMES +
    "?comando=" +
    encodeURIComponent(texto);

  fetch(url)
    .then(function(resposta) {
      return resposta.text();
    })
    .then(function(resposta) {

      document.getElementById("resultado").innerText =
        resposta;

      falarResposta(resposta);
    })
    .catch(function(erro) {

      document.getElementById("resultado").innerText =
        "Erro ao conectar com o HERMES.";
    });
};

reconhecimento.onerror = function(event) {

  document.getElementById("resultado").innerText =
    "Erro no reconhecimento de voz: " +
    event.error;
};

function falarResposta(texto) {

  var voz = new SpeechSynthesisUtterance(texto);

  voz.lang = "pt-BR";
  voz.rate = 1;
  voz.pitch = 1;

  speechSynthesis.speak(voz);
}


  </script>

</body>
</html>
